name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NUXT_LIBROO_RUNTIME_PROFILE: selfhost
      NUXT_BETTER_AUTH_SECRET: libroo-e2e-fixed-better-auth-secret-at-least-32-bytes
      NUXT_BETTER_AUTH_RATE_LIMIT_ENABLED: false
      NUXT_EMAIL_VERIFICATION_ENABLED: false
      NUXT_PUBLIC_TURNSTILE_ENABLED: false
      NUXT_PUBLIC_REGISTRATION_ENABLED: true
      LIBROO_E2E_RUN_ID: github-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Install node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps

      - name: Build Nuxt self-host app
        run: pnpm build:selfhost

      - name: Run E2E tests
        timeout-minutes: 20
        run: pnpm test:e2e:run

      - name: Upload Playwright artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/
            test-results/
            /tmp/libroo-e2e/github-${{ github.run_id }}-${{ github.run_attempt }}/logs/
