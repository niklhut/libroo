services:
  libroo:
    image: ${LIBROO_IMAGE:-ghcr.io/niklhut/libroo:latest}
    ports:
      - "3000:3000"
    environment:
      NUXT_BETTER_AUTH_SECRET: ${NUXT_BETTER_AUTH_SECRET:?set NUXT_BETTER_AUTH_SECRET}
      NUXT_BETTER_AUTH_URL: ${NUXT_BETTER_AUTH_URL:-http://localhost:3000}
      NUXT_PUBLIC_PASSKEYS_ENABLED: ${NUXT_PUBLIC_PASSKEYS_ENABLED:-false}
      NUXT_LIBROO_RUNTIME_PROFILE: selfhost
      NUXT_DATABASE_URL: file:/data/db/sqlite.db
      NUXT_LOCAL_STORAGE_DIR: /data/blob
      NUXT_TRUSTED_IP_HEADERS: ${NUXT_TRUSTED_IP_HEADERS:-}
      NUXT_BOOKS_BULK_ADD_MAX_COUNT: ${NUXT_BOOKS_BULK_ADD_MAX_COUNT:-20}
      NUXT_BOOKS_BULK_LOOKUP_RATE_LIMIT_MAX_REQUESTS: ${NUXT_BOOKS_BULK_LOOKUP_RATE_LIMIT_MAX_REQUESTS:-10}
      NUXT_BOOKS_BULK_LOOKUP_RATE_LIMIT_WINDOW_SECONDS: ${NUXT_BOOKS_BULK_LOOKUP_RATE_LIMIT_WINDOW_SECONDS:-60}
      NUXT_BOOKS_ENRICHMENT_BACKOFF_SECONDS: ${NUXT_BOOKS_ENRICHMENT_BACKOFF_SECONDS:-60}
      NUXT_BOOKS_ENRICHMENT_BATCH_SIZE: ${NUXT_BOOKS_ENRICHMENT_BATCH_SIZE:-20}
      NUXT_BOOKS_ENRICHMENT_CONCURRENCY: ${NUXT_BOOKS_ENRICHMENT_CONCURRENCY:-4}
      NUXT_BOOKS_ENRICHMENT_LEASE_SECONDS: ${NUXT_BOOKS_ENRICHMENT_LEASE_SECONDS:-900}
      NUXT_BOOKS_ENRICHMENT_MAX_ATTEMPTS: ${NUXT_BOOKS_ENRICHMENT_MAX_ATTEMPTS:-5}
      NUXT_BOOKS_ENRICHMENT_RECOVERY_SAFETY_SECONDS: ${NUXT_BOOKS_ENRICHMENT_RECOVERY_SAFETY_SECONDS:-35}
      NUXT_BOOKS_ENRICHMENT_RECOVERY_TIME_BUDGET_SECONDS: ${NUXT_BOOKS_ENRICHMENT_RECOVERY_TIME_BUDGET_SECONDS:-840}
      NUXT_BOOKS_RATE_LIMIT_ENABLED: ${NUXT_BOOKS_RATE_LIMIT_ENABLED:-false}
      NUXT_BOOKS_RATE_LIMIT_MAX_REQUESTS: ${NUXT_BOOKS_RATE_LIMIT_MAX_REQUESTS:-30}
      NUXT_BOOKS_RATE_LIMIT_WINDOW_SECONDS: ${NUXT_BOOKS_RATE_LIMIT_WINDOW_SECONDS:-60}
      NUXT_OPEN_LIBRARY_CONTACT_EMAIL: ${NUXT_OPEN_LIBRARY_CONTACT_EMAIL:-}
      NUXT_PUBLIC_OPEN_LIBRARY_LINKS_ENABLED: ${NUXT_PUBLIC_OPEN_LIBRARY_LINKS_ENABLED:-false}
      NUXT_EMAIL_VERIFICATION_ENABLED: ${NUXT_EMAIL_VERIFICATION_ENABLED:-false}
      NUXT_PUBLIC_REGISTRATION_ENABLED: ${NUXT_PUBLIC_REGISTRATION_ENABLED:-true}
      NUXT_PUBLIC_TURNSTILE_ENABLED: ${NUXT_PUBLIC_TURNSTILE_ENABLED:-false}
      NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY:-}
      NUXT_TURNSTILE_SECRET_KEY: ${NUXT_TURNSTILE_SECRET_KEY:-}
      NUXT_TURNSTILE_ALLOWED_HOSTNAMES: ${NUXT_TURNSTILE_ALLOWED_HOSTNAMES:-}
      NUXT_EMAIL_PROVIDER: ${NUXT_EMAIL_PROVIDER:-smtp}
      NUXT_EMAIL_FROM: ${NUXT_EMAIL_FROM:-}
      NUXT_EMAIL_REPLY_TO: ${NUXT_EMAIL_REPLY_TO:-}
      NUXT_SMTP_HOST: ${NUXT_SMTP_HOST:-}
      NUXT_SMTP_PORT: ${NUXT_SMTP_PORT:-587}
      NUXT_SMTP_SECURE: ${NUXT_SMTP_SECURE:-false}
      NUXT_SMTP_USER: ${NUXT_SMTP_USER:-}
      NUXT_SMTP_PASSWORD: ${NUXT_SMTP_PASSWORD:-}
      NUXT_PLUNK_API_KEY: ${NUXT_PLUNK_API_KEY:-}
      NUXT_PLUNK_BASE_URL: ${NUXT_PLUNK_BASE_URL:-https://next-api.useplunk.com}
      NUXT_PUBLIC_LEGAL_PRIVACY_POLICY_URL: ${NUXT_PUBLIC_LEGAL_PRIVACY_POLICY_URL:-}
      NUXT_PUBLIC_LEGAL_IMPRINT_URL: ${NUXT_PUBLIC_LEGAL_IMPRINT_URL:-}
      NUXT_PUBLIC_LEGAL_TERMS_URL: ${NUXT_PUBLIC_LEGAL_TERMS_URL:-}
      NUXT_LEGAL_PRIVACY_POLICY_MARKDOWN_URL: ${NUXT_LEGAL_PRIVACY_POLICY_MARKDOWN_URL:-}
      NUXT_LEGAL_IMPRINT_MARKDOWN_URL: ${NUXT_LEGAL_IMPRINT_MARKDOWN_URL:-}
      NUXT_LEGAL_TERMS_MARKDOWN_URL: ${NUXT_LEGAL_TERMS_MARKDOWN_URL:-}
      NUXT_LEGAL_MARKDOWN_FETCH_TIMEOUT_SECONDS: ${NUXT_LEGAL_MARKDOWN_FETCH_TIMEOUT_SECONDS:-5}
      NUXT_OPEN_LIBRARY_COVER_TIMEOUT_SECONDS: ${NUXT_OPEN_LIBRARY_COVER_TIMEOUT_SECONDS:-20}
      NUXT_OPEN_LIBRARY_REQUEST_TIMEOUT_SECONDS: ${NUXT_OPEN_LIBRARY_REQUEST_TIMEOUT_SECONDS:-12}
      NUXT_PLUNK_SEND_TIMEOUT_SECONDS: ${NUXT_PLUNK_SEND_TIMEOUT_SECONDS:-5}
    volumes:
      - libroo-data:/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    restart: unless-stopped

volumes:
  libroo-data:
